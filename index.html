<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый проект</title>
    <link rel="stylesheet" href="css\style.css">
</head>
<body>
    <header>
        <h1>Привет, мир!</h1>
    </header>

    <main>
        <p>Это моя первая страница после перерыва.</p>
    </main>

    <section class="products">
        <h2>Наши товары</h2>
        <div class="products-grid" id="products-container">
            
        </div>
    </section>
    <section class="slider-section">
        <h2>Галерея</h2>
        <div class="slider">
            <div class="slider-track">
                <div class="slide">
                    <img src="https://via.placeholder.com/800x400/4a90e2/ffffff?text=Слайд+1" alt="Слайд 1">
                </div>
                <div class="slide">
                    <img src="https://via.placeholder.com/800x400/e24a4a/ffffff?text=Слайд+2" alt="Слайд 2">
                </div>
                <div class="slide">
                    <img src="https://via.placeholder.com/800x400/4ae27a/ffffff?text=Слайд+3" alt="Слайд 3">
                </div>
            </div>
            <button class="slider-btn prev">‹</button>
            <button class="slider-btn next">›</button>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
